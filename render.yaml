# Render Blueprint — Seedqura API
# Dashboard: New → Blueprint → connect github.com/seedqura/seedqura
# After deploy, set secrets in the Render dashboard (see DEPLOY.md).

services:
  - type: web
    name: seedqura-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://seedqura.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://seedqura.com
      - key: SESSION_TIMEZONE
        value: Asia/Kolkata
      - key: MAIL_FROM
        value: Seedqura <hello@seedqura.com>
      # Set these in the Render dashboard (sync: false = secret / manual):
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
